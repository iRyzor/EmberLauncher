[package]
name = "ember-protocol"
version = "0.1.0"
edition = "2021"
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
aes = { version = "0.8.4", features = ["zeroize"] }
cbc = { version = "0.1.2", features = ["zeroize"] }
rsa = "0.9.10"
rand = "0.8.5"
zeroize = "1.8"
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "rustls-tls"] }
serde_json = "1"
base64 = "0.22"
